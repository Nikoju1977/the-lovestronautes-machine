name: Validate web app

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: node scripts/validate.mjs

      - name: Audio encoder tests
        run: node scripts/test-audio-exports.mjs

      - name: Psy instruments tests
        run: node scripts/test-psy-machines.mjs

      - name: Song creator musical tests
        run: node scripts/test-track-creator.mjs

      - name: Mobile audio and voice regression
        run: node scripts/test-voice-reliability.mjs

      - name: Cwejman S1 MK2 inspired synth regression
        run: node scripts/test-cwejman-s1.mjs

      - name: Taiga modular and mobile keyboards regression
        run: node scripts/test-taiga-keyboard.mjs

      - name: Loop Studio clips and export regression
        run: node scripts/test-loop-studio.mjs

      - name: Four hardware-inspired synthesizers regression
        run: node scripts/test-hardware-synth.mjs

      - name: Real Chromium user-interface smoke test
        run: node scripts/test-browser-smoke.mjs
