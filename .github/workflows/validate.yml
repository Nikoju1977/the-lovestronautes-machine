name: Validate web app

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: node scripts/validate.mjs

      - name: Audio encoder tests
        run: node scripts/test-audio-exports.mjs

      - name: Psy instruments tests
        run: node scripts/test-psy-machines.mjs

      - name: Song creator musical tests
        run: node scripts/test-track-creator.mjs

      - name: Mobile audio and voice regression
        run: node scripts/test-voice-reliability.mjs

      - name: Cwejman S1 MK2 inspired synth regression
        run: node scripts/test-cwejman-s1.mjs

      - name: Taiga modular and mobile keyboards regression
        run: node scripts/test-taiga-keyboard.mjs

      - name: Loop Studio clips and export regression
        run: node scripts/test-loop-studio.mjs

      - name: Four hardware-inspired synthesizers regression
        run: node scripts/test-hardware-synth.mjs

      - name: Field Kit electroacoustic and mobile EQ regression
        run: node scripts/test-field-kit-mobile-eq.mjs

      - name: V18 safe 100 MB import and anti-crash regression
        run: node scripts/test-v18-import-stability.mjs

      - name: Grandmother monophonic synthesis and MIDI compatibility
        run: node scripts/test-grandmother-v19.mjs

      - name: iOS Safari and Android audio compatibility regressions
        run: node scripts/test-platform-compat.mjs

      - name: V22 continuous playback stability and fault isolation
        run: node scripts/test-playback-stability-v22.mjs

      - name: V20 patchbay routing regression
        run: node scripts/test-patchbay-v20.mjs

      - name: Real Chromium user-interface smoke test
        run: node scripts/test-browser-smoke.mjs

  webkit-mobile-smoke:
    name: WebKit phone-sized browser check (Safari engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit

      - name: Real WebKit mobile viewport smoke test
        run: node scripts/test-webkit-smoke.mjs
